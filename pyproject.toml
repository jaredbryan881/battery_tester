[project]
name = "battery-tester"
version = "0.1.0"
description = "Workflows for 18650 characterization"
requires-python = ">=3.11"
dependencies = [
    "pyvisa",
    "pyvisa-py",
    "pyserial",
    "pyyaml",
    "pytest",
]

[tool.pytest.ini_options]
markers = [
    "live: requires real hardware",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"